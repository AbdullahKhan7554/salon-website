<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FAQ — Scissors VIP Salon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFE8DC}
a{color:#8C2F1F;text-decoration:none}a:hover{color:#6E2215}
summary::-webkit-details-marker{display:none}
</style>
</helmet>
<div style="background:#EFE8DC;color:#161311;font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.65">
<dc-import name="Header" active="faq" hint-size="100%,88px"></dc-import>
<main style="max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,96px) 28px clamp(72px,9vw,128px);display:flex;flex-wrap:wrap;gap:clamp(40px,6vw,96px)">
<div style="flex:1 1 320px;min-width:0">
<nav aria-label="Breadcrumb" style="font-size:13px;color:#5E554B;margin-bottom:28px"><a href="Home.dc.html" style="color:#5E554B">Home</a> / <span style="color:#161311">FAQ</span></nav>
<h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(48px,6vw,88px);line-height:0.95;letter-spacing:-0.02em">Questions, <em style="color:#8C2F1F">answered.</em></h1>
<p style="margin:24px 0 32px;color:#5E554B;font-size:17px;max-width:340px">Everything about our salon, home visits and booking. Still unsure? Message us.</p>
<a href="https://wa.me/971501374524?text=Hi%2C%20I%20have%20a%20question." style="background:#8C2F1F;color:#EFE8DC;padding:16px 26px;min-height:52px;box-sizing:border-box;display:inline-flex;align-items:center;gap:10px;font-size:15px">Ask on WhatsApp <span aria-hidden="true">→</span></a>
</div>
<div style="flex:2 1 560px;min-width:0;border-top:1px solid #161311">
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="10">
<details style="border-bottom:1px solid #CFC6B8">
<summary style="list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:26px 0;min-height:44px">
<h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(24px,2.4vw,30px);line-height:1.2">{{f.q}}</h2>
<span aria-hidden="true" style="flex:0 0 auto;font-size:26px;line-height:1;color:#8C2F1F">+</span>
</summary>
<p style="margin:0 0 28px;max-width:640px;color:#2C2622;font-size:17px">{{f.a}}</p>
</details>
</sc-for>
</div>
</main>
<dc-import name="Footer" hint-size="100%,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1800}}'>
class Component extends DCLogic {
renderVals() {
return {
faqs: [
{ q: 'What services do you offer?', a: 'Men’s haircuts, beard grooming, facials, hair colouring and home grooming services across Dubai. See the full list on our Services page.' },
{ q: 'Do you offer home service?', a: 'Yes. Book an appointment and the barber comes to your doorstep with professional tools.' },
{ q: 'Which areas do you cover for home service?', a: 'Most areas within Dubai. Message us your location to confirm.' },
{ q: 'Is home service safe and hygienic?', a: 'Yes. We follow strict hygiene protocols, and every tool is sanitised before each visit.' },
{ q: 'How can I book an appointment?', a: 'Through WhatsApp, a phone call, our social media pages or this website.' },
{ q: 'Do you accept walk-ins?', a: 'Walk-ins are welcome, but we recommend booking in advance to avoid waiting.' },
{ q: 'How long does a haircut take?', a: 'Usually 30 to 45 minutes, depending on the style and service.' },
{ q: 'How experienced is your barber?', a: 'Our founder Hammad Ahmad has over 18 years of experience, and every team member is trained for a high standard of service.' },
{ q: 'What products do you use?', a: 'Professional-grade grooming and haircare products.' },
{ q: 'Do you offer packages or memberships?', a: 'Yes, we offer grooming packages and loyalty discounts. Ask in the salon or message us for details.' }
]
};
}
}
</script>
</body>
</html>
