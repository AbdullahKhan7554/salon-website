<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terms &amp; Conditions — Scissors VIP Salon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFE8DC}
a{color:#8C2F1F;text-decoration:none}a:hover{color:#6E2215}
</style>
</helmet>
<div style="background:#EFE8DC;color:#161311;font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.7">
<dc-import name="Header" active="none" hint-size="100%,88px"></dc-import>
<main style="max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,96px) 28px clamp(72px,9vw,128px)">
<nav aria-label="Breadcrumb" style="font-size:13px;color:#5E554B;margin-bottom:28px"><a href="Home.dc.html" style="color:#5E554B">Home</a> / <span style="color:#161311">Terms &amp; Conditions</span></nav>
<h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(48px,6vw,88px);line-height:0.95">Terms &amp; Conditions</h1>
<p style="margin:20px 0 56px;color:#5E554B;font-size:17px;max-width:640px">These terms apply to the website and services of Scissors VIP Salon, Dubai.</p>
<div style="display:flex;flex-direction:column;border-top:1px solid #161311">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="8">
<section style="display:flex;flex-wrap:wrap;gap:12px clamp(32px,5vw,80px);padding:36px 0;border-bottom:1px solid #CFC6B8">
<h2 style="margin:0;flex:1 1 260px;min-width:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:30px;line-height:1.15"><span style="color:#8C2F1F;margin-right:12px">{{s.n}}</span>{{s.title}}</h2>
<ul style="margin:0;flex:2 1 480px;min-width:0;padding-left:20px;color:#2C2622">
<sc-for list="{{s.points}}" as="p" hint-placeholder-count="3"><li style="margin-bottom:8px">{{p.t}}</li></sc-for>
</ul>
</section>
</sc-for>
</div>
</main>
<dc-import name="Footer" hint-size="100%,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2200}}'>
class Component extends DCLogic {
renderVals() {
const s = (n, title, pts) => ({ n, title, points: pts.map((t) => ({ t })) });
return {
sections: [
s('01', 'Appointments & cancellations', ['Booking in advance is recommended to secure your slot.', 'Cancellations need at least 12 hours’ notice.', 'Arriving 10 or more minutes late may shorten your service or require rescheduling.']),
s('02', 'Service satisfaction', ['Our barbers are trained to deliver professional grooming.', 'If you are not satisfied, tell us before leaving. A complimentary correction may be offered within 3 days.', 'Completed services are generally non-refundable, except in exceptional cases.']),
s('03', 'Pricing', ['All prices include 5% UAE VAT.', 'Prices may vary slightly with hair length, thickness or custom requests.', 'The salon may change prices without prior notice.']),
s('04', 'Health & safety', ['Please tell us about any scalp infection, skin condition or allergy before your service.', 'Hygiene follows Dubai Municipality standards.']),
s('05', 'Children & pets', ['Children under 12 must be supervised by an adult.', 'Pets are not allowed on the premises, except service animals.']),
s('06', 'Intellectual property', ['Logos, images and branding belong to Scissors VIP Salon and may not be copied without permission.']),
s('07', 'Limitation of liability', ['We are not liable for allergic reactions or dissatisfaction caused by inaccurate client information.', 'Liability is limited to the cost of the service.']),
s('08', 'Jurisdiction', ['These terms are governed by UAE law, under Dubai Civil Law.'])
]
};
}
}
</script>
</body>
</html>
